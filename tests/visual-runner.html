<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8"><title>AiGGB Visual Test Runner</title>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex}
#sidebar{width:280px;padding:16px;overflow-y:auto;border-right:1px solid #1e293b}
#sidebar h2{color:#1e88e5;font-size:16px;margin:0 0 12px 0}
#sidebar p{font-size:12px;color:#64748b}
#sidebar .list{list-style:none;padding:0}
#sidebar .list li{padding:6px 8px;margin:2px 0;border-radius:6px;cursor:pointer;font-size:13px}
#sidebar .list li:hover{background:#1e293b}
#sidebar .list li.active{background:#1e88e522;color:#1e88e5}
#sidebar .list li.done{color:#43a047}
#sidebar .list li.fail{color:#e53935}
#sidebar button{margin-top:8px;padding:6px 12px;border:1px solid #1e88e5;border-radius:6px;background:transparent;color:#1e88e5;cursor:pointer;width:100%}
#main{flex:1;display:flex;flex-direction:column}
#ggb-container{flex:1}
#status{padding:8px 16px;font-size:13px;border-top:1px solid #1e293b;background:#1e293b}
#report-area{display:none}
</style>
</head>
<body>
<div id="sidebar">
  <h2>Visual Test Runner</h2>
  <p id="progress">Loading fixtures…</p>
  <ul class="list" id="case-list"></ul>
  <button id="run-all">▶ 跑全部截图</button>
  <button id="download-report">📥 下载报告 HTML</button>
</div>
<div id="main">
  <div id="ggb-container"></div>
  <div id="status">等待开始…</div>
</div>

<script>
// ===== 嵌入 fixtures 数据（从 tests/fixtures/ 预先编译） =====
const FIXTURES = {};
const CASES = [];

async function loadFixtures() {
  // 从 cases.json 和 fixtures/ 加载（需要在同域或 CORS）
  const casesResp = await fetch('../src/tests/fixtures/../cases.json?' + Date.now()).catch(() => null);
  if (casesResp) {
    const data = await casesResp.json();
    for (const tc of data.cases) {
      CASES.push(tc);
      try {
        const fr = await fetch(`../src/tests/fixtures/${tc.id}.json?` + Date.now());
        if (fr.ok) FIXTURES[tc.id] = await fr.json();
      } catch(e) {}
    }
  }
  if (CASES.length === 0) {
    // fallback: hardcode a few core fixtures
    const core = [
      {id:"P-projectile",title:"斜抛运动",cat:"physics"},
      {id:"P-pendulum",title:"单摆",cat:"physics"},
      {id:"P-incline",title:"斜面受力",cat:"physics"},
      {id:"D-cycloid",title:"摆线",cat:"dynamic"},
      {id:"X-composite-pendulums",title:"双摆",cat:"composite"},
      {id:"X-composite-compare",title:"斜抛对比",cat:"composite"},
    ];
    CASES.push(...core);
  }
}
</script>
</body>
</html>
