<!doctype html>
<html lang="zh">
<head><meta charset="UTF-8"><title>AiGGB Visual Test</title>
<style>
  /* 画布最大化：铺满视口，完整反映演示效果 */
  body{margin:0;background:#fff;overflow:hidden}
  #ggb{width:100vw;height:100vh}
</style>
<!-- ★ 唯一 op 执行宿主：视觉回归（tests/visual-screenshots.ts）与 README 效果图
     （scripts/regen-demos.ts）共用本文件，op 执行器镜像 src/lib/ggbBridge.ts。
     必须经 Vite dev server（http://localhost:5173）访问：加载本地自托管 GGB bundle，
     与生产一致、不依赖 CDN。
     用法：?cmds=<JSON> 必填；?app=3d 可选（3D 场景以 appName "3d" 注入）。 -->
<script src="/GeoGebra/deployggb.js"></script>
</head>
<body>
<div id="ggb"></div>
<script>
// 接收来自 Playwright 的命令列表，逐条执行后以 document.title=DONE:ok/total 信号完成。
const params = new URLSearchParams(location.search);
const commandsJson = params.get("cmds");
const appName = params.get("app") === "3d" ? "3d" : "classic";
if (!commandsJson) {
  document.body.innerHTML = "<h2>No commands provided. Use ?cmds=... query param.</h2>";
} else {
  let commands;
  try { commands = JSON.parse(decodeURIComponent(commandsJson)); }
  catch(e) { document.body.innerHTML = "<h2>Invalid JSON</h2>"; throw e; }

  const applet = new GGBApplet({
    appName: appName, width: 1000, height: 700,
    showToolBar: false, showAlgebraInput: false, showMenuBar: false,
    showResetIcon: false, enableLabelDrags: false, enableShiftDragZoom: true,
    enableRightClick: false, errorDialogsActive: false, useBrowserForJS: true,
    language: "zh", preventFocus: true,
    appletOnLoad: api => { window.__ggbApplet__ = api; }, // 显式挂载，不依赖 GGB 自动全局
    scaleContainerClass: "ggb-container-scale"
  }, true);

  applet.setHTML5Codebase(new URL("/GeoGebra/HTML5/5.0/web3d/", location.origin).href);
  applet.inject("ggb");

  // ── op 执行器（镜像 src/lib/ggbBridge.ts）──
  const hexToRgb = hex => {
    const m = hex.replace(/^#/, "");
    return [parseInt(m.slice(0,2),16), parseInt(m.slice(2,4),16), parseInt(m.slice(4,6),16)];
  };

  const isCoordLiteral = s => /^\s*\(/.test(s) && /\)\s*$/.test(s);

  function executeOne(api, cmd) {
    try {
      switch (cmd.op) {
        case "eval": {
          // ★ Delete 特判（与生产 ggbBridge 同语义）：成败都返回 false，用存在性前后对比判定
          const delM = /^(?:\w+\s*=\s*)?Delete\s*\(\s*([A-Za-z_]\w*)\s*\)\s*;?\s*$/.exec(cmd.cmd.trim());
          if (delM) {
            const existed = api.exists(delM[1]);
            api.evalCommand(cmd.cmd);
            const ok2 = existed && !api.exists(delM[1]);
            if (!ok2) return false;
            return true;
          }
          const ok = api.evalCommand(cmd.cmd);
          // ★ scripting 命令（Set*/Show*/ZoomIn 等不产生新对象的命令）成功也返回 false，
          //   与生产 ggbBridge.isScriptingCommand 同语义，不以此判定失败
          if (!ok && /^(?:Set|Show)[A-Za-z]|^(?:ZoomIn|ZoomOut|CenterView|Pan|StartAnimation|StopAnimation)\b/.test(cmd.cmd.trim())) return true;
          return ok;
        }
        case "slider": {
          const ok = api.evalCommand(`${cmd.name} = Slider(${cmd.min}, ${cmd.max}, ${cmd.step}, 1, 150, false, true, false, false)`);
          if (!ok) return false;
          api.evalCommand(`SetValue(${cmd.name}, ${cmd.value})`);
          const cap = cmd.label ? (cmd.unit ? `${cmd.label} = %v ${cmd.unit}` : `${cmd.label} = %v`) : (cmd.unit ? `${cmd.name} = %v ${cmd.unit}` : "");
          if (cap) { api.setCaption(cmd.name, cap); api.setLabelStyle(cmd.name, 3); }
          return true;
        }
        case "animate": {
          if (!api.exists(cmd.target)) return false;
          if (cmd.speed !== undefined) api.setAnimationSpeed(cmd.target, cmd.speed);
          if (cmd.repeat) {
            const map = { oscillating: 0, increasing: 1, once: 3 };
            api.evalCommand(`SetAnimationType(${cmd.target}, ${map[cmd.repeat]})`);
          }
          api.setAnimating(cmd.target, cmd.on);
          if (cmd.on) api.startAnimation(); else api.stopAnimation();
          return true;
        }
        case "trace": {
          if (!api.exists(cmd.target)) return false;
          api.setTrace(cmd.target, cmd.on); return true;
        }
        case "style": {
          if (cmd.color) { const [r,g,b]=hexToRgb(cmd.color); api.setColor(cmd.target,r,g,b); }
          if (cmd.thickness !== undefined) api.setLineThickness(cmd.target, cmd.thickness);
          if (cmd.visible !== undefined) api.setVisible(cmd.target, cmd.visible);
          if (cmd.opacity !== undefined) {
            // ★ 与生产 ggbBridge 一致：SetLineOpacity 是 scripting 命令，成功也返回 false，
            //   生效与否以 getXML 实读 lineStyle opacity（0~255 刻度，默认 178≈0.7）为准；
            //   未生效（如 3D 立体）才回退 SetFilling——否则 2D 圆会被无谓填充（灰盘）
            api.evalCommand(`SetLineOpacity(${cmd.target}, ${cmd.opacity})`);
            const ls = /<lineStyle[^>]*?opacity="([\d.]+)"/.exec(api.getXML(cmd.target) || "");
            const lo = ls ? parseFloat(ls[1]) / 255 : undefined;
            const applied = lo !== undefined ? Math.abs(lo - cmd.opacity) <= 0.02 : cmd.opacity >= 0.99;
            if (!applied) api.evalCommand(`SetFilling(${cmd.target}, ${cmd.opacity})`);
          }
          if (cmd.dashed !== undefined) api.setLineStyle(cmd.target, cmd.dashed ? 1 : 0);
          if (cmd.pointSize !== undefined) api.setPointSize(cmd.target, cmd.pointSize);
          if (cmd.pointStyle !== undefined) api.setPointStyle(cmd.target, cmd.pointStyle);
          return true;
        }
        case "view": {
          api.setCoordSystem(cmd.xmin, cmd.xmax, cmd.ymin, cmd.ymax);
          if (cmd.axesUnit && api.setAxisUnits) api.setAxisUnits(1, cmd.axesUnit[0], cmd.axesUnit[1], "");
          return true;
        }
        case "caption": { api.setCaption(cmd.target, cmd.text); api.setLabelStyle(cmd.target, 3); return true; }
        case "delete": { api.deleteObject(cmd.target); return true; }
        case "reset": { api.newConstruction(); return true; }
        case "vector": {
          if (!(isCoordLiteral(cmd.from) || api.exists(cmd.from))) return false;
          const ok = api.evalCommand(`${cmd.name} = Vector(${cmd.from}, ${cmd.to})`);
          if (!ok) return false;
          if (cmd.color) { const [r,g,b]=hexToRgb(cmd.color); api.setColor(cmd.name,r,g,b); }
          api.setLineThickness(cmd.name, 4);
          if (cmd.label) { api.setCaption(cmd.name, cmd.label); api.setLabelStyle(cmd.name, 3); }
          return true;
        }
        case "forceDiagram": {
          if (!(isCoordLiteral(cmd.at) || api.exists(cmd.at))) return false;
          let allOk = true;
          for (let fi = 0; fi < cmd.forces.length; fi++) {
            const f = cmd.forces[fi];
            // ★ 临时名不能以 "_" 开头——GGB 拒绝下划线开头的对象名（与生产 tmpFv 前缀一致）
            const t = `tmpFv${fi}`;
            if (!api.evalCommand(`${t} = Vector((0,0), ${f.vec})`)) { allOk = false; continue; }
            if (!api.evalCommand(`${f.name} = Vector(${cmd.at}, ${cmd.at} + ${t})`)) { allOk = false; continue; }
            if (f.color) { const [r,g,b]=hexToRgb(f.color); api.setColor(f.name,r,g,b); }
            api.setLineThickness(f.name, 4);
            if (f.label) { api.setCaption(f.name, f.label); api.setLabelStyle(f.name, 3); }
            api.setVisible(t, false);
          }
          return allOk;
        }
        case "physicsTrace": { api.setTrace(cmd.target, true); return true; }
        case "unitAxes": {
          const xl = cmd.xLabel ? `${cmd.xLabel}/${cmd.xUnit}` : `/${cmd.xUnit}`;
          const yl = cmd.yLabel ? `${cmd.yLabel}/${cmd.yUnit}` : `/${cmd.yUnit}`;
          api.setAxisLabels(1, xl, yl, "");
          return true;
        }
        case "constants": {
          const vals = { g:9.8, c:3e8, e:1.6e-19, eps0:8.854e-12, mu0:1.2566e-6, k_e:8.99e9, Grav:6.6743e-11, h:6.626e-34, k_B:1.381e-23 };
          for (const n of cmd.names) {
            if (!(n in vals)) continue;
            if (api.exists(n)) continue;
            if (!api.evalCommand(`${n} = ${vals[n]}`)) return false;
            api.setVisible(n, false);
          }
          return true;
        }
        default: return false;
      }
    } catch(e) { return false; }
  }

  // GGB 加载完成后执行全部命令
  window.__ggbApplet__ = undefined;
  const waitForAPI = setInterval(() => {
    const api = window.__ggbApplet__;
    if (!api || !api.evalCommand) return;
    clearInterval(waitForAPI);

    let ok = 0, fail = 0;
    const failedIdx = [];
    for (let i = 0; i < commands.length; i++) {
      if (executeOne(api, commands[i])) ok++; else { fail++; failedIdx.push(i); }
    }
    // 信号完成（带失败索引便于调试）
    document.title = "DONE:" + ok + "/" + (ok+fail) + " fail:" + failedIdx.join(",");
  }, 200);
}
</script>
</body>
</html>
