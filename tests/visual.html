<!doctype html>
<html lang="zh">
<head><meta charset="UTF-8"><title>AiGGB Visual Test</title>
<style>
  body{margin:0;background:#fff;display:flex;justify-content:center;align-items:center;height:100vh}
  #ggb{width:1000px;height:700px}
</style>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
</head>
<body>
<div id="ggb"></div>
<script>
// 接收来自 Playwright 的命令列表，逐条执行后信号完成
const params = new URLSearchParams(location.search);
const commandsJson = params.get("cmds");
if (!commandsJson) {
  document.body.innerHTML = "<h2>No commands provided. Use ?cmds=... query param.</h2>";
} else {
  let commands;
  try { commands = JSON.parse(decodeURIComponent(commandsJson)); }
  catch(e) { document.body.innerHTML = "<h2>Invalid JSON</h2>"; throw e; }

  const applet = new GGBApplet({
    appName: "classic", width: 1000, height: 700,
    showToolBar: false, showAlgebraInput: false, showMenuBar: false,
    showResetIcon: false, enableLabelDrags: false, enableShiftDragZoom: true,
    enableRightClick: false, errorDialogsActive: false, useBrowserForJS: true,
    language: "zh", preventFocus: true
  }, true);

  applet.setHTML5Codebase("https://www.geogebra.org/apps/latest/web3d/");
  applet.inject("ggb");

  // GGB 加载完成后执行命令
  window.__ggbApplet__ = undefined;
  const waitForAPI = setInterval(() => {
    const api = window.ggbApplet;
    if (!api || !api.evalCommand) return;
    clearInterval(waitForAPI);

    // 逐条执行 eval 命令
    const evalCmds = commands.filter(c => c.op === "eval");
    const otherCmds = commands.filter(c => c.op !== "eval");
    let ok = 0, fail = 0;
    for (const c of evalCmds) {
      if (api.evalCommand(c.cmd)) ok++; else fail++;
    }
    // 执行其他 op（简化：只处理 style/trace/view/animate）
    for (const c of otherCmds) {
      try {
        if (c.op === "style" && c.color) { const [r,g,b]=[(parseInt(c.color.slice(1,3),16)),(parseInt(c.color.slice(3,5),16)),(parseInt(c.color.slice(5,7),16))]; api.setColor(c.target,r,g,b); if(c.thickness)api.setLineThickness(c.target,c.thickness); }
        if (c.op === "trace" || c.op === "physicsTrace") api.setTrace(c.target, c.on ?? true);
        if (c.op === "view") api.setCoordSystem(c.xmin, c.xmax, c.ymin, c.ymax);
        if (c.op === "animate" && c.on) { api.setAnimating(c.target,true); api.startAnimation(); }
      } catch(e) {}
    }
    // 信号完成
    document.title = "DONE:" + ok + "/" + (ok+fail);
  }, 200);
}
</script>
</body>
</html>
